name: Performance Benchmarks

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'benchmark/**'
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-12 mold
    
    - name: Configure CMake with optimizations
      run: |
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++-12 \
          -DBUILD_TESTING=ON \
          -DBUILD_BENCHMARKS=ON \
          -DPURGATORY_USE_MOLD=ON \
          -B build
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run benchmarks
      run: |
        ./build/benchmark/purgatory_bench \
          --benchmark_format=json \
          --benchmark_out=benchmark_results.json \
          --benchmark_repetitions=3 \
          --benchmark_report_aggregates_only=true
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.sha }}
        path: benchmark_results.json
        retention-days: 90
    
    # ========================================
    # Validate and Store Baseline
    # ========================================
    # Validate benchmark output before storing as baseline
    
    - name: Setup Python for validation
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Validate benchmark results
      run: |
        set -euo pipefail
        
        echo "🔍 Validating benchmark output..."
        
        # Validate JSON structure
        if ! python3 -c "import json; data = json.load(open('benchmark_results.json')); print(f\"Found {len(data.get('benchmarks', []))} benchmarks\")" 2>&1; then
          echo "::error::Invalid benchmark JSON output"
          exit 1
        fi
        
        # Check for empty results
        benchmark_count=$(python3 -c "import json; print(len(json.load(open('benchmark_results.json')).get('benchmarks', [])))")
        if [[ "$benchmark_count" -eq 0 ]]; then
          echo "::error::No benchmarks found in output"
          exit 1
        fi
        
        echo "✅ Benchmark validation passed: $benchmark_count benchmarks"
    
    # ========================================
    # Performance Regression Check
    # ========================================
    # Download previous baseline and compare (only on main branch pushes)
    
    - name: Download previous baseline
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: dawidd6/action-download-artifact@v3
      with:
        workflow: benchmark.yml
        branch: main
        name: benchmark-baseline
        path: baseline/
        if_no_artifact_found: warn
      continue-on-error: true
    
    - name: Compare against baseline
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        if [[ -f baseline/benchmark_results.json ]]; then
          echo "📊 Comparing against previous baseline..."
          python3 benchmark/benchmark_compare.py \
            baseline/benchmark_results.json \
            benchmark_results.json \
            --threshold 10
        else
          echo "⚠️  No previous baseline found - this may be the first run"
          echo "✅ Skipping regression check"
        fi
    
    - name: Upload benchmark baseline
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-baseline
        path: benchmark_results.json
        retention-days: 90

  cpu-profiling:
    name: CPU Profiling
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-12 linux-tools-generic valgrind
    
    - name: Configure with profiling
      run: |
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_CXX_COMPILER=g++-12 \
          -DCMAKE_CXX_FLAGS="-pg" \
          -DCMAKE_EXE_LINKER_FLAGS="-pg" \
          -DBUILD_TESTING=ON \
          -DBUILD_BENCHMARKS=ON \
          -B build-prof
    
    - name: Build
      run: cmake --build build-prof --parallel
    
    - name: Run with gprof
      run: |
        # Run both main executable and benchmarks for profiling
        if [[ -f build-prof/purgatory ]]; then
          ./build-prof/purgatory src/test.txt
          gprof ./build-prof/purgatory gmon.out > gprof_report.txt 2>&1 || true
        fi
        
        if [[ -f build-prof/benchmark/purgatory_bench ]]; then
          ./build-prof/benchmark/purgatory_bench --benchmark_filter=.*_Short
          gprof ./build-prof/benchmark/purgatory_bench gmon.out > gprof_bench_report.txt 2>&1 || true
        fi
      continue-on-error: true
    
    - name: Run cachegrind
      run: |
        if [[ -f build-prof/purgatory ]]; then
          valgrind --tool=cachegrind \
            --cachegrind-out-file=cachegrind.out \
            ./build-prof/purgatory src/test.txt 2>&1 || true
          
          cg_annotate cachegrind.out > cachegrind_report.txt 2>&1 || true
        fi
      continue-on-error: true
    
    - name: Upload profiling reports
      uses: actions/upload-artifact@v4
      with:
        name: profiling-reports
        path: |
          gprof_report.txt
          gprof_bench_report.txt
          cachegrind_report.txt
        retention-days: 30
      continue-on-error: true
